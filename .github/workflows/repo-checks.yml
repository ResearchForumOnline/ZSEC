name: Repo checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shell syntax
        run: bash -n install.sh scripts/install-on-host.sh tests/test-systemd-timers.sh tests/test-package-lock-policy.sh tests/test-advisory-match-policy.sh zsec

      - name: Persistent timer schedules
        run: |
          bash tests/test-systemd-timers.sh
          bash tests/test-package-lock-policy.sh
          bash tests/test-advisory-match-policy.sh

      - name: Python compile
        run: python3 -m py_compile tools/build-feed.py tests/test-build-feed.py tests/test-public-release-links.py

      - name: Feed classification tests
        run: python3 tests/test-build-feed.py

      - name: Public release links
        run: python3 tests/test-public-release-links.py

      - name: Advisory feed JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          feed = json.loads(Path("site/talktoai-zsec/feed.json").read_text(encoding="utf-8"))
          assert feed.get("schema") == "zsec.feed.v1", "unexpected feed schema"
          items = feed.get("items")
          assert isinstance(items, list) and items, "feed items must be a nonempty list"

          item_ids = [item.get("id") for item in items]
          assert all(isinstance(item_id, str) and item_id for item_id in item_ids), "feed item IDs must be nonempty strings"
          assert len(item_ids) == len(set(item_ids)), "feed item IDs must be unique"

          sources = {source.get("name"): source for source in feed.get("sources", [])}
          for name in ("CISA KEV", "The Hacker News RSS"):
              source = sources.get(name)
              assert source, f"missing required source: {name}"
              assert source.get("status") == "ok", f"required source is unhealthy: {name}"
              assert isinstance(source.get("items"), int) and source["items"] > 0, f"required source is empty: {name}"

          policy = feed.get("policy", {})
          assert policy.get("remote_commands_allowed") is False, "remote commands must remain disabled"
          assert policy.get("auto_update_scope") == "OS security packages only", "auto-update scope must remain security-only"
          print(f"Feed items: {len(feed['items'])}")
          PY

      - name: Markdown relative links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          link_re = re.compile(r'\[[^\]]+\]\(([^)]+)\)|<a\s+[^>]*href="([^"]+)"', re.I)
          missing = []

          for path in root.rglob("*.md"):
              if ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              for match in link_re.finditer(text):
                  target = (match.group(1) or match.group(2) or "").strip()
                  if not target or target.startswith(("#", "http://", "https://", "mailto:")):
                      continue
                  clean = target.split("#", 1)[0].replace("%20", " ")
                  if clean and not (path.parent / clean).resolve().exists():
                      missing.append(f"{path.relative_to(root)} -> {target}")

          if missing:
              raise SystemExit("Missing relative links:\n" + "\n".join(missing))
          print("Markdown relative links: ok")
          PY
